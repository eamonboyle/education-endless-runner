name: Unity Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Requires UNITY_LICENSE secret configured in GitHub repo settings.
      # Generate a .ulf file by activating Unity on a local machine, then
      # paste its contents into the UNITY_LICENSE repository secret.
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2022.3.9f1
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results
